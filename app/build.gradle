plugins { id 'com.android.application' }

android {
    namespace 'com.gingerbread.launcher'
    compileSdk 34
    defaultConfig {
        applicationId "com.gingerbread.launcher"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "2.3.6"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
